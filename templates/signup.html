{% extends 'base.html' %}
{% block title %}Create account | Traveller Stop{% endblock %}

{% block content %}
<section class="container auth-wrapper">
    <div class="auth-layout">
        <div class="auth-form">
            <h1>Create an account</h1>
            <form action="{{ url_for('signup') }}" method="post" class="form-stack">
                <div>
                    <label class="form-label" for="signup-name">Full name</label>
                    <input class="form-control" id="signup-name" name="username" autocomplete="name" maxlength="100" required>
                </div>
                <div>
                    <label class="form-label" for="signup-email">Email address</label>
                    <input class="form-control" id="signup-email" name="email" type="email" autocomplete="email" maxlength="120" required>
                </div>
                <div>
                    <label class="form-label" for="signup-password">Password</label>
                    <input class="form-control" id="signup-password" name="password" type="password" autocomplete="new-password"
                           minlength="8" aria-describedby="password-help" required>
                    <div class="form-text" id="password-help">Use at least 8 characters with upper and lowercase letters, a number, and a symbol.</div>
                </div>
                <button class="btn btn-primary" type="submit">Create account</button>
            </form>
            <a class="btn btn-outline-primary w-100 mt-3" href="{{ url_for('google_login') }}">Continue with Google</a>
            <p class="mt-3 mb-0">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
        </div>
        <div class="auth-sidebar" aria-hidden="true"></div>
    </div>
</section>
{% endblock %}
