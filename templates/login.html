{% extends 'base.html' %}
{% block title %}Sign in | Traveller Stop{% endblock %}

{% block content %}
<section class="container auth-wrapper">
    <div class="auth-layout">
        <div class="auth-form">
            <h1>Sign in</h1>
            <form action="{{ url_for('login') }}" method="post" class="form-stack">
                <div>
                    <label class="form-label" for="login-email">Email address</label>
                    <input class="form-control" id="login-email" name="email" type="email" autocomplete="username" required>
                </div>
                <div>
                    <label class="form-label" for="login-password">Password</label>
                    <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required>
                </div>
                <button class="btn btn-primary" type="submit">Sign in</button>
            </form>
            <a class="btn btn-outline-primary w-100 mt-3" href="{{ url_for('google_login') }}">Continue with Google</a>
            <p class="mt-3 mb-0">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
        </div>
        <div class="auth-sidebar" aria-hidden="true"></div>
    </div>
</section>
{% endblock %}
