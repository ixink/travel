{% extends 'base.html' %}

{% block title %}Edit Room - Traveller Stop{% endblock %}

{% block content %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10 col-xl-8">

            <div class="card shadow-lg border-0 overflow-hidden">
                
                <!-- Header -->
                <div class="card-header bg-warning py-4 border-0">
                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
                        <div>
                            <h2 class="fw-bold text-dark mb-1">
                                <i class="fas fa-edit me-2"></i> Edit Room
                            </h2>
                            <p class="mb-0 text-dark opacity-75">
                                Update your room information
                            </p>
                        </div>
                        <a href="{{ url_for('profile') }}" class="btn btn-dark">
                            <i class="fas fa-arrow-left me-2"></i> Back to Profile
                        </a>
                    </div>
                </div>

                <div class="card-body p-5">

                    <form method="POST" enctype="multipart/form-data" id="editRoomForm">

                        <!-- Current Image -->
                        <div class="mb-5">
                            <label class="form-label fw-bold">Current Room Image</label>
                            <div class="text-center border rounded-4 p-3 bg-light">
                                <img src="{{ get_room_image(room.image_url) }}" 
                                     class="img-fluid rounded-3 shadow-sm" 
                                     style="max-height: 380px; object-fit: cover; width: 100%;"
                                     alt="{{ room.title }}">
                            </div>
                        </div>

                        <!-- Upload New Image -->
                        <div class="mb-5">
                            <label class="form-label fw-bold">
                                <i class="fas fa-camera me-2"></i> Change Room Image (Optional)
                            </label>
                            <input type="file" name="room_image" class="form-control form-control-lg" 
                                   accept="image/*">
                            <small class="text-muted">Leave empty to keep current image</small>
                        </div>

                        <!-- Title -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Room Title</label>
                            <input type="text" name="title" class="form-control form-control-lg" 
                                   value="{{ room.title }}" placeholder="e.g. Cozy Single Room in Gulshan" required>
                        </div>

                        <!-- Description -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Description</label>
                            <textarea name="description" class="form-control" rows="6" required>
{{ room.description }}
                            </textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Location</label>
                                <input type="text" name="location" class="form-control form-control-lg" 
                                       value="{{ room.location }}" placeholder="e.g. Gulshan-2, Dhaka" required>
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Price per Night (৳)</label>
                                <input type="number" name="price" class="form-control form-control-lg" 
                                       value="{{ room.price_per_night }}" step="10" min="500" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Available From</label>
                                <input type="date" name="available_from" class="form-control form-control-lg" 
                                       value="{{ room.available_from }}">
                            </div>
                            <div class="col-md-6 mb-4">
                                <label class="form-label fw-bold">Available To</label>
                                <input type="date" name="available_to" class="form-control form-control-lg" 
                                       value="{{ room.available_to }}">
                            </div>
                        </div>

                        <!-- Amenities -->
                        <div class="mb-5">
                            <label class="form-label fw-bold fs-5">Amenities</label>
                            <div class="row g-3">
                                {% set amenities_list = room.get('amenities', []) %}
                                
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Free WiFi" 
                                               {% if 'Free WiFi' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Free WiFi</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Air Conditioning" 
                                               {% if 'Air Conditioning' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Air Conditioning</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Parking" 
                                               {% if 'Parking' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Parking</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Television" 
                                               {% if 'Television' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Television</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Kitchen" 
                                               {% if 'Kitchen' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Kitchen</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Washing Machine" 
                                               {% if 'Washing Machine' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Washing Machine</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Balcony" 
                                               {% if 'Balcony' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Balcony</label>
                                    </div>
                                </div>
                                <div class="col-md-4 col-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" name="amenities" value="Hot Water" 
                                               {% if 'Hot Water' in amenities_list %}checked{% endif %}>
                                        <label class="form-check-label">Hot Water</label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-grid gap-3">
                            <button type="submit" class="btn btn-warning btn-lg py-3 fw-bold">
                                <i class="fas fa-save me-2"></i> Update Room Information
                            </button>
                            
                            <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary btn-lg py-3">
                                Cancel
                            </a>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
